<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Mini Estacionamiento — Dashboard</title>
  <style>
    :root { --bd:#e5e7eb; --txt:#111827; }
    *{box-sizing:border-box}
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:24px;color:var(--txt)}
    h2{margin:0 0 12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
    .card{border:1px solid var(--bd);border-radius:12px;padding:16px}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--bd);margin-left:8px}
    button{padding:8px 12px;border-radius:8px;border:1px solid var(--bd);cursor:pointer;background:#fff}
    button+button{margin-left:8px}
    footer{margin-top:20px;font-size:12px;color:#6b7280}
  </style>
</head>
<body>
  <h2>Mini Estacionamiento <span id="conn" class="pill">desconectado</span></h2>

  <div class="grid" id="slots"></div>

  <p>
    <button onclick="sendAll(true)">Cerrar TODOS</button>
    <button onclick="sendAll(false)">Abrir TODOS</button>
  </p>

  <footer>
    Broker: <code id="broker"></code>
  </footer>

  <script src="https://unpkg.com/paho-mqtt/mqttws31.min.js"></script>

  <script>
    // === Parámetros inyectados por Flask (Jinja) ===
    const host     = {{ mqtt_host|tojson }};
    const port     = {{ mqtt_ws_port|tojson }};
    const path     = {{ mqtt_path|tojson }};
    const username = {{ mqtt_user|tojson }};
    const password = {{ mqtt_pass|tojson }};
    const useSSL   = {{ use_ssl|tojson }};

    // Mostrar datos de conexión
    document.getElementById('broker').textContent =
      (useSSL ? 'wss://' : 'ws://') + host + ':' + port + path;

    const clientId = "web-" + Math.random().toString(16).slice(2);
    const client = new Paho.MQTT.Client(host, Number(port), path, clientId);

    const state = {};
    const conn = document.getElementById('conn');
    const grid = document.getElementById('slots');

    function render() {
      grid.innerHTML = "";
      const slots = Object.keys(state).sort();
      if (slots.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'card';
        empty.textContent = 'Esperando telemetría...';
        grid.appendChild(empty);
        return;
      }
      slots.forEach(slot => {
        const s = state[slot] || {};
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3 style="margin:0 0 8px">${slot}
            <span class="pill">${s.online ?? 'unknown'}</span>
          </h3>
          <p style="margin:0 0 8px">Estado:
            <strong>${s.prox ? 'OCUPADO' : 'LIBRE'}</strong>
          </p>
          <div>
            <button onclick="send('${slot}', true)">Cerrar</button>
            <button onclick="send('${slot}', false)">Abrir</button>
          </div>`;
        grid.appendChild(card);
      });
    }

    function send(slot, close) {
      const msg = new Paho.MQTT.Message(JSON.stringify({ open: close }));
      msg.destinationName = `parking/${slot}/motor/cmd`;
      msg.qos = 1;
      client.send(msg);
    }

    function sendAll(close) {
      Object.keys(state).forEach(s => send(s, close));
    }

    client.onConnectionLost = () => {
      conn.textContent = "desconectado";
      conn.style.borderColor = "#ef4444";
    };

    client.onMessageArrived = (msg) => {
      const m = msg.destinationName.match(/^parking\/([^/]+)\/(sensor|status)$/);
      if (!m) return;
      const slot = m[1], kind = m[2];
      state[slot] = state[slot] || {};
      if (kind === "sensor") {
        try {
          const j = JSON.parse(msg.payloadString);
          state[slot].prox = Number(j.prox) || 0;
        } catch(e) { }
      } else {
        state[slot].online = msg.payloadString;
      }
      render();
    };

    client.connect({
      userName: username,
      password: password,
      useSSL: useSSL,
      timeout: 8,
      onSuccess: () => {
        conn.textContent = "conectado";
        conn.style.borderColor = "#10b981";
        client.subscribe("parking/+/sensor", { qos: 0 });
        client.subscribe("parking/+/status", { qos: 0 });
        render();
      },
      onFailure: (err) => {
        conn.textContent = "error";
        conn.style.borderColor = "#ef4444";
        console.error("MQTT WS connect failed:", err);
      }
    });
  </script>
</body>
</html>
