<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Miniestacionamiento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
  </style>
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">Miniestacionamiento</h1>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex gap-2 mb-3">
          <button class="btn btn-danger" onclick="setMotor('on')">
            Motor ON (cerrar)
          </button>
          <button class="btn btn-success" onclick="setMotor('off')">
            Motor OFF (abrir)
          </button>
        </div>

        <div id="statusRow" class="d-flex align-items-center gap-2">
          <span id="led" class="dot bg-secondary"></span>
          <span id="txt" class="fw-medium">Leyendo estado…</span>
        </div>

        <div class="text-muted small mt-2" id="meta"></div>
      </div>
    </div>
  </div>

<script>
async function setMotor(state){
  try{
    const r = await fetch('/api/motor', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({state})
    });
    const t = await r.text();
    alert(t);
  }catch(e){ alert('Error: '+e); }
}

async function poll(){
  try{
    const r = await fetch('/api/status');
    const j = await r.json();
    const led = document.getElementById('led');
    const txt = document.getElementById('txt');
    const meta = document.getElementById('meta');

    if (j.prox === 1){
      led.className = 'dot bg-danger';
      txt.textContent = 'OCUPADO (puerta cerrada)';
    } else {
      led.className = 'dot bg-success';
      txt.textContent = 'LIBRE (puerta abierta)';
    }
    meta.textContent = `motor_deseado=${j.motor_desired} | actualizado=${j.updated_at}`;
  }catch(e){
    // ignora errores de red momentáneos
  }
  setTimeout(poll, 1000);
}
poll();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
