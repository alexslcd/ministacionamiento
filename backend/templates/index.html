<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Estacionamiento · Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body{background:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial,sans-serif;}
  .card{border:1px solid #e5e7eb;border-radius:14px;}
  .status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;}
  .status-dot.ok{background:#22c55e;box-shadow:0 0 0 6px rgba(34,197,94,.15);}
  .status-dot.busy{background:#e11d48;box-shadow:0 0 0 6px rgba(225,29,72,.15);}

  /* Escenario de peaje */
  .gate-scene{
    position:relative; height:220px; border-radius:14px; overflow:hidden;
    background:linear-gradient(180deg,#dbeafe 0%,#f8fafc 100%); border:1px dashed #cbd5e1;
  }
  .road{
    position:absolute; left:0; right:0; bottom:0; height:110px;
    background:repeating-linear-gradient(90deg,#475569 0 24px,#334155 24px 48px);
  }
  .barrier{
    position:absolute; right:40px; bottom:110px; width:12px; height:100px; border-radius:6px;
    background:linear-gradient(180deg,#1f2937,#111827); transform-origin:bottom center;
    transition:transform .6s ease;
  }

  /* Auto */
  .car-wrap{
    position:absolute; bottom:100px; /* justo sobre la pista */
    width:190px; height:95px;
    transition:left .8s ease, transform .8s ease;
  }
  .car-svg{width:100%;height:100%;display:block;}
  .wheelSpin{ transform-origin:50% 50%; animation:spin 1.1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  /* --- Bahías de estacionamiento --- */
  .bay{
    position:relative; height:96px; border-radius:12px;
    background:linear-gradient(180deg,#ffffff,#f8fafc);
    border:1px solid #e2e8f0;
    display:flex; align-items:center; justify-content:space-between;
    padding:0.75rem 1rem; gap:0.75rem;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .bay:hover{ transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.06); }
  .bay::before{ /* línea blanca lateral simulando rayado */
    content:""; position:absolute; right:0; top:0; bottom:0; width:10px;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.9) 0 10px, rgba(255,255,255,0) 10px 20px);
    border-top-right-radius:12px; border-bottom-right-radius:12px; opacity:.75;
  }
  .bay.free{ border-color:#bbf7d0; background:linear-gradient(180deg,#f0fff4,#dcfce7); }
  .bay.busy{ border-color:#fecaca; background:linear-gradient(180deg,#fff5f5,#fee2e2); }

  .bay .left{
    display:flex; align-items:center; gap:.65rem;
  }
  .bay .pill{
    font-size:.75rem; letter-spacing:.4px; padding:.2rem .5rem;
    border-radius:999px; font-weight:600;
  }
  .pill.free{ background:#16a34a; color:#fff; }
  .pill.busy{ background:#e11d48; color:#fff; }
  .slot-name{ font-weight:700; font-variant-numeric:tabular-nums; }

  .bay .icon{
    width:42px; height:42px; border-radius:10px; display:grid; place-items:center;
    background:#fff; border:1px solid #e2e8f0;
    box-shadow:0 2px 6px rgba(0,0,0,.05);
  }
</style>
</head>
<body>

<header class="bg-white border-bottom">
  <div class="container py-3 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
      <span class="badge text-bg-primary rounded-pill px-3 py-2">
        <i class="bi bi-hdd-network me-1"></i> Estacionamiento
      </span>
      <span class="text-muted small">Monitoreo en tiempo real</span>
    </div>
    <div class="small text-muted">
      <span id="headerDot" class="status-dot ok"></span><span id="headerText">Libre</span>
    </div>
  </div>
</header>

<main class="container my-4">
  <!-- Escena del peaje -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5 class="mb-3">Entrada / Peaje</h5>
      <div class="gate-scene">
        <div class="road"></div>

        <!-- Auto (SVG) -->
        <div id="carWrap" class="car-wrap" style="left:10%;">
          <svg class="car-svg" viewBox="0 0 600 300" aria-label="Auto realista" role="img">
            <defs>
              <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
                <feOffset dy="6" result="off"/>
                <feMerge><feMergeNode in="off"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#6aa9ff"/><stop offset="45%" stop-color="#2d6cdf"/><stop offset="100%" stop-color="#153b9f"/>
              </linearGradient>
              <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#e6f3ff" stop-opacity=".95"/><stop offset="100%" stop-color="#9ec7ff" stop-opacity=".85"/>
              </linearGradient>
              <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f7f7f7"/><stop offset="100%" stop-color="#b9c0c9"/>
              </linearGradient>
            </defs>

            <ellipse cx="300" cy="255" rx="150" ry="20" fill="rgba(0,0,0,.25)"/>
            <g filter="url(#softShadow)">
              <path d="M60,210 C80,165 140,150 250,150 L420,150 C500,150 540,175 560,210 L560,220 L60,220 Z" fill="url(#paint)"/>
              <path d="M190,115 C220,95 280,90 340,95 C380,98 410,105 440,125 L465,150 L225,150 Z" fill="url(#paint)"/>
              <path d="M230,120 L330,118 C365,118 395,126 420,143 L320,143 Z" fill="url(#glass)"/>
              <path d="M320,118 L410,120 C432,125 448,135 460,148 L420,148 L330,143 Z" fill="url(#glass)"/>
              <rect x="80" y="205" width="460" height="6" rx="3" fill="url(#chrome)"/>
              <rect x="270" y="170" width="28" height="6" rx="3" fill="#cfd5df" opacity=".9"/>
              <rect x="360" y="170" width="28" height="6" rx="3" fill="#cfd5df" opacity=".9"/>
              <ellipse cx="545" cy="198" rx="12" ry="8" fill="#ffd166">
                <animate attributeName="opacity" values="1;0.6;1" dur="1.6s" repeatCount="indefinite"/>
              </ellipse>
              <ellipse cx="85" cy="198" rx="10" ry="7" fill="#ff6b6b" opacity=".95"/>
              <path d="M155,220 a45,45 0 1,1 0,-1 Z" fill="rgba(0,0,0,.18)"/>
              <path d="M445,220 a45,45 0 1,1 0,-1 Z" fill="rgba(0,0,0,.18)"/>
              <g transform="translate(155,215)">
                <circle r="44" fill="#0f172a"/><circle r="34" fill="#1f2937"/><circle r="8" fill="#cbd5e1"/>
              </g>
              <g transform="translate(445,215)">
                <circle r="44" fill="#0f172a"/><circle r="34" fill="#1f2937"/><circle r="8" fill="#cbd5e1"/>
              </g>
              <g class="wheelSpin" transform="translate(155,215)">
                <rect x="-3" y="-34" width="6" height="68" rx="3" fill="#9aa3ad"/>
                <rect x="-34" y="-3" width="68" height="6" rx="3" fill="#9aa3ad"/>
              </g>
              <g class="wheelSpin" transform="translate(445,215)">
                <rect x="-3" y="-34" width="6" height="68" rx="3" fill="#9aa3ad"/>
                <rect x="-34" y="-3" width="68" height="6" rx="3" fill="#9aa3ad"/>
              </g>
            </g>
          </svg>
        </div>

        <div id="barrier" class="barrier"></div>
      </div>
      <div class="text-muted small mt-2">
        <i class="bi bi-info-circle me-1"></i>El auto y la barrera reaccionan al valor real del sensor.
      </div>
    </div>
  </div>

  <!-- Panel estado -->
  <div class="row g-4">
    <div class="col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="mb-3">Resumen</h5>
          <div class="d-flex justify-content-between">
            <div><div class="text-muted small">Ocupados</div><div id="occupied" class="fs-4 fw-bold">0</div></div>
            <div><div class="text-muted small">Libres</div><div id="free" class="fs-4 fw-bold">0</div></div>
            <div><div class="text-muted small">Capacidad</div><div id="capacity" class="fs-4 fw-bold">0</div></div>
          </div>
          <hr>
          <button id="btnOn" class="btn btn-outline-danger w-100 mb-2">
            <i class="bi bi-toggle-on me-1"></i>Motor ON
          </button>
          <button id="btnOff" class="btn btn-outline-success w-100">
            <i class="bi bi-toggle-off me-1"></i>Motor OFF
          </button>
        </div>
      </div>
    </div>

    <!-- Mapa de puestos con bahías -->
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="mb-3">Mapa de puestos</h5>
          <div id="grid" class="row g-3"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const carWrap=document.getElementById('carWrap');
  const barrier=document.getElementById('barrier');
  const headerDot=document.getElementById('headerDot');
  const headerText=document.getElementById('headerText');
  const occupiedEl=document.getElementById('occupied');
  const freeEl=document.getElementById('free');
  const capEl=document.getElementById('capacity');
  const grid=document.getElementById('grid');
  const btnOn=document.getElementById('btnOn');
  const btnOff=document.getElementById('btnOff');

  function renderGrid(slots){
    grid.innerHTML='';
    const names=Object.keys(slots).sort((a,b)=>{
      const na=parseInt(a.replace(/\D/g,''))||0, nb=parseInt(b.replace(/\D/g,''))||0;
      return na-nb;
    });
    for(const name of names){
      const occ = !!slots[name];
      const col=document.createElement('div');
      col.className='col-12 col-md-6';
      col.innerHTML = `
        <div class="bay ${occ?'busy':'free'}">
          <div class="left">
            <div class="icon"><i class="bi ${occ?'bi-car-front-fill':'bi-square'}"></i></div>
            <div>
              <div class="slot-name">${name}</div>
              <div class="text-muted small">${occ ? 'Vehículo presente' : 'Disponible'}</div>
            </div>
          </div>
          <span class="pill ${occ?'busy':'free'}">${occ?'OCUPADO':'LIBRE'}</span>
        </div>`;
      grid.appendChild(col);
    }
  }

  async function poll(){
    try{
      const r=await fetch('/api/status',{cache:'no-store'});
      const j=await r.json();
      occupiedEl.textContent=j.occupied;
      freeEl.textContent=j.free;
      capEl.textContent=j.capacity;
      renderGrid(j.slots);

      const s1=j.slots?.S1??0; // slot de entrada
      carWrap.style.left = s1 ? '70%' : '10%';
      barrier.style.transform = s1 ? 'rotate(80deg)' : 'rotate(0deg)';

      headerDot.className='status-dot '+(j.free>0?'ok':'busy');
      headerText.textContent=j.free>0?'Libre':'Ocupado';
    }catch(e){
      console.error(e);
      headerDot.className='status-dot bg-secondary';
      headerText.textContent='Sin conexión';
    }finally{
      setTimeout(poll,1000);
    }
  }

  btnOn.onclick = () => fetch('/api/motor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:'on'})});
  btnOff.onclick= () => fetch('/api/motor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:'off'})});
  poll();
</script>
</body>
</html>
